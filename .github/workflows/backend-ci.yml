name: Backend DevSecOps CI

# Lance la CI quand le backend change ou sur une PR vers main.
on:
  push:
    branches: [main, master]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]

# Le workflow a seulement besoin de lire le dépôt donc permission en lecture uniquement.
permissions:
  contents: read

jobs:
  # Job 1 : vérifie la qualité et la sécurité du code Java.
  # Lance Checkstyle, Hadolint, les tests JUnit, JaCoCo et SonarQube.
  lint-test:
    name: Build & Tests
    runs-on: ubuntu-latest
    steps:
      # Récupère le projet avec l'historique Git pour Sonar.
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Utilise Java 21 pour compiler et tester le backend.
      - name: Préparer java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Vérifier la version de Java
        run:
          java -version

          # Vérifie les bonnes pratiques du Dockerfile.
      - name: Vérifier le Dockerfile avec Hadolint
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            hadolint/hadolint:latest \
            hadolint /repo/apps/backend/annonces-service/Dockerfile
      # Lance Checkstyle, les tests et le seuil JaCoCo.
      - name: Build, tests et couverture JaCoCo
        run: bash ./mvnw clean verify
        working-directory: apps/backend/annonces-service
        env:
          # Identifiants réservés à la base temporaire des tests.
          POSTGRES_USER: collector_test
          POSTGRES_PASSWORD: test_password
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/collector_annonces
      # Envoie les résultats à Sonar et vérifie son Quality Gate.
      - name: Analyse SonarQube Cloud
        run: bash ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true
        working-directory: apps/backend/annonces-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    # Base PostgreSQL temporaire utilisée par les tests Spring Boot.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: collector_annonces
          POSTGRES_USER: collector_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_test -d collector_annonces"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  # Job 2 : construit l'image Docker du backend et analyse sa sécurité.
  # Il démarre uniquement si le premier job a réussi.
  docker-security:
    name: Securite image Docker
    runs-on: ubuntu-latest
    needs: lint-test

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # Recupere le code du projet.
      - name: Recuperer le code
        uses: actions/checkout@v7

      # Construit notre image Docker multi-stage.
      - name: Construire l'image Docker
        run: docker build -t collector-annonces:ci ./apps/backend/annonces-service

      # Bloque la CI si l'image contient une vulnerabilite haute ou critique.
      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: collector-annonces:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      # Genere l'inventaire des composants de notre image Docker.
      - name: Generer le SBOM avec Syft
        run: |
          mkdir -p reports/sbom
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:latest \
            docker:collector-annonces:ci \
            -o cyclonedx-json > reports/sbom/collector-annonces.cdx.json

      # Conserve le rapport SBOM dans les artifacts GitHub Actions.
      - name: Sauvegarder le SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-collector-annonces-${{ github.sha }}
          path: reports/sbom/collector-annonces.cdx.json
          retention-days: 30
          if-no-files-found: error

      # Installe Cosign pour signer notre image Docker.
      - name: Installer Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.0.0

      # Connexion à GHCR (GitHub Container Registry) uniquement sur main.
      - name: Connexion à GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publie sur GHCR la même image que celle analysée par Trivy.
      - name: Publier l'image sur GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/badr59k/collector-annonces:sha-${GITHUB_SHA}"
          docker tag collector-annonces:ci "$IMAGE"
          docker push "$IMAGE"

      # Signe l'image publiée en utilisant son digest.
      - name: Signer l'image avec Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/badr59k/collector-annonces:sha-${GITHUB_SHA}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          test -n "$DIGEST"
          cosign sign --yes "ghcr.io/badr59k/collector-annonces@${DIGEST}"

      # Verifie que notre workflow GitHub a bien signe l'image.
      - name: Verifier la signature Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/badr59k/collector-annonces:sha-${GITHUB_SHA}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          test -n "$DIGEST"
          cosign verify "ghcr.io/badr59k/collector-annonces@${DIGEST}" \
            --certificate-identity="https://github.com/badr59k/collector-cesi/.github/workflows/backend-ci.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

  # Job 3 : propose le deploiement de la nouvelle image Docker.
  mise-a-jour-image:
    name: Proposer la nouvelle image
    runs-on: ubuntu-latest
    needs: docker-security

    # Execute uniquement apres un push sur main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Recupere le depot avec le token autorisant la creation de PR.
      - name: Recuperer le code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.COLLECTOR_DEPLOY_TOKEN }}

      # Remplace l'ancien tag Docker par celui du commit publie.
      - name: Mettre a jour le tag Docker
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          fichier = Path("infra/k8s/overlays/local/kustomization.yaml")
          contenu = fichier.read_text(encoding="utf-8")

          contenu, nombre = re.subn(
              r"(?m)^([ \t]*newTag:[ \t]*)sha-[0-9a-f]{40}[ \t]*$",
              lambda match: match.group(1) + "sha-" + os.environ["IMAGE_SHA"],
              contenu,
          )

          if nombre != 1:
              raise SystemExit("Erreur : tag Docker introuvable ou ambigu.")

          fichier.write_text(contenu, encoding="utf-8")
          PY

      # Cree une PR pour proposer la nouvelle version.
      - name: Creer la PR de deploiement
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.COLLECTOR_DEPLOY_TOKEN }}
          add-paths: infra/k8s/overlays/local/kustomization.yaml
          branch: deploy/collector-annonces
          base: main
          delete-branch: true
          commit-message: "ci: mise a jour de l'image Docker Collector"
          title: "ci: deploiement de la nouvelle image Collector"
          body: |
            PR generee automatiquement par GitHub Actions.

            Met a jour l'image Docker du service annonces
            apres sa publication et sa signature sur GHCR.
