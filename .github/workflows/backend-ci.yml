name: Backend DevSecOps CI

on:
  push:
    branches: [main, master]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    name: Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Préparer java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Vérifier la version de Java
        run: java -version
      - name: Build, tests et couverture JaCoCo
        run: bash ./mvnw clean verify
        working-directory: apps/backend/annonces-service
        env:
          POSTGRES_USER: collector_test
          POSTGRES_PASSWORD: test_password
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/collector_annonces
      - name: Analyse SonarQube Cloud
        run: bash ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true
        working-directory: apps/backend/annonces-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: collector_annonces
          POSTGRES_USER: collector_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_test -d collector_annonces"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
