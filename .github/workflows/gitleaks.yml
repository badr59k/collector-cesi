name: Secret Scanning - Gitleaks

# Vérifie les secrets à chaque push ou PR
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan des secrets
    runs-on: ubuntu-latest

    steps:
      # Récupère l'historique Git sans garder le token dans le checkout.
      - name: Recuperer le code et l'historique Git
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Analyse les commits. Le job échoue si un secret est repéré.
      - name: Analyser les secrets avec Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="--all" --redact --verbose
